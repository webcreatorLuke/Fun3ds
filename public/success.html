<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Order confirmation — Fun3ds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<header class="site-header"><div class="wrap"><a class="logo" href="index.html"><span class="dot"></span>Fun3ds</a></div></header>
<div class="wrap" style="max-width:520px; padding-top:64px;">
  <div class="panel" style="text-align:center;">
    <h1 style="font-family:var(--font-display); font-size:26px;" id="title">Checking your order…</h1>
    <p id="message" style="color:var(--text-dim);">One second.</p>
    <a href="index.html" class="btn" style="margin-top:12px;">Back to shop</a>
  </div>
</div>
<script type="module">
  import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { db } from "./js/firebase-config.js";

  const params = new URLSearchParams(window.location.search);
  const orderId = params.get("orderId");
  const title = document.getElementById("title");
  const message = document.getElementById("message");

  if (!orderId) {
    title.textContent = "No order found";
  } else {
    // The Stripe webhook is what actually marks this "paid" server-side —
    // this page just reflects that status once it lands.
    onSnapshot(doc(db, "orders", orderId), (snap) => {
      const order = snap.data();
      if (!order) return;
      if (order.status === "paid") {
        title.textContent = "Payment confirmed 🎉";
        message.textContent = `Thanks! Your ${order.items?.[0]?.name || "print"} is queued to print.`;
      } else if (order.status === "pending") {
        title.textContent = "Confirming payment…";
        message.textContent = "This usually takes a few seconds.";
      } else if (order.status === "failed") {
        title.textContent = "Payment didn't go through";
        message.textContent = "No charge was made. Please try again.";
      }
    });
  }
</script>
</body>
</html>
