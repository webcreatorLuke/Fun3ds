name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firebase.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write Firebase service account key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "${{ github.workspace }}/gcp-key.json"

      - name: Deploy Firestore rules
        run: |
          npx firebase-tools deploy \
            --only firestore \
            --project ${{ secrets.FIREBASE_PROJECT_ID }} \
            --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-key.json

      - name: Clean up key file
        if: always()
        run: |
          rm -f "${{ github.workspace }}/gcp-key.json"
